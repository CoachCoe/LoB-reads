# Which slice of Open Library the catalog keeps.
#
# The full dump is ~20M editions and needs roughly 150GB with indexes. The
# defaults below yield a catalog large enough to stress search and pagination
# but small enough to reindex on a laptop, and small enough to fit the 20GB
# free tier of the managed Postgres this was first sized for.
#
# Nothing here is hardcoded in SQL — relax these and re-run 04-slice.sql to
# widen or narrow the catalog. Set them all permissive for a full ingest.

min_publish_year: 1900
languages: [eng]
require_isbn: true
require_cover: true           # editions without a cover are dropped
require_author: true          # the spec's M1 acceptance expects >=1 author
min_editions_per_work: 1

# Implemented, and off deliberately.
#
# With goodbooks-10k loaded it keeps the works someone has actually rated:
# measured against the real catalog, 6,943,467 works become 8,659. That is a
# fixture, not a library — useful for exercising recommendations where every
# work has ratings, and not much else.
#
# It was originally the plan for fitting the AWS free tier. That reason is
# gone: the full sliced catalog measures 11GB and fits 20GB with room spare.
#
# 04-slice.sql refuses if the corpus covers fewer than 1,000 works, because on
# a database that has never run `npm run social:load` every work fails the test
# and the filter would delete the entire catalog while reporting success.
must_appear_in_rating_corpus: false
