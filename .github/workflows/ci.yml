name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: bookshelf

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Prisma needs a syntactically valid URL to generate the client and for
      # `next build` to collect page data. Nothing here connects to a database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookshelf
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bookshelf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      - name: Build
        run: npx next build
